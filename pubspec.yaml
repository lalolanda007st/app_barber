name: barber_app
description: BarberVision - Previsualizador de cortes para barberías
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  image: ^4.1.7
  http: ^1.2.1
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
 #   - assets/hairstyles/
  #  - assets/overlays/
